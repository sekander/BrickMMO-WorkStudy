<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Wallet Interface</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #333;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 700px;
      margin: auto;
    }
    h1, h2 {
      color: #0056b3;
    }
    h2 {
      border-bottom: 2px solid #0056b3;
      padding-bottom: 5px;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    input[type="password"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      margin-right: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .admin-section button {
      background-color: #dc3545;
    }
    .admin-section button:hover {
      background-color: #c82333;
    }
    pre {
      background-color: #eee;
      padding: 10px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.9em;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .success {
      color: green;
      font-weight: bold;
    }
    .logout {
      text-align: right;
      margin-bottom: 10px;
    }
    .logout button {
      background-color: gray;
      color: white;
      padding: 6px 12px;
    }
    .logout button:hover {
      background-color: #555;
    }
    .accordion { margin-bottom: 15px; }
    .accordion-toggle {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      text-align: left;
      font-size: 16px;
      font-weight: bold;
      border: none;
      outline: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .accordion-toggle:hover { background-color: #0056b3; }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease-out;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 5px 5px;
    }
    .accordion-content .section {
      margin: 0;
      border: none;
      padding: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table th, table td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
    .tx-sent { color: red; }
    .tx-received { color: green; }
    .tx-neutral { color: black; }

    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .modal-close-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>

<main class="container">
  <div class="logout">
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <h1>Admin Wallet Dashboard 👑</h1>

  <section class="section" id="walletManagement">
    <h2>🔑 Wallet Management</h2>
    <button onclick="getBalances()">Get All Balances</button>
  </section>

  <div class="accordion">
    <button class="accordion-toggle">📜 Transaction History</button>
    <div class="accordion-content">
      <label for="filterTxDropdown">Filter by User Wallet:</label>
      <select id="filterTxDropdown"><option value="">All Users</option></select>
      <button onclick="loadTransactionsFromDropdown()">Load Transactions</button>
      <div id="historyContainer" style="margin-top: 15px;"></div>
    </div>
  </div>

  <section class="section admin-section" id="adminSection">
    <h2>👑 Admin Actions</h2>
    <label for="adminRecipientSelect">Select User Wallet to Add Coins To:</label>
    <select id="adminRecipientSelect">
      <option value="">Loading users...</option>
    </select>
    <label for="adminAmount">Amount:</label>
    <input type="number" id="adminAmount" placeholder="Amount of Coins">
    <button onclick="prepareAdminAddCoins()">Admin Add Coins</button>
  </section>

  <div class="accordion">
    <button class="accordion-toggle">📋 API Response</button>
    <div class="accordion-content">
      <div id="responseArea" class="section">
        <pre id="apiResponse">Responses will appear here...</pre>
      </div>
    </div>
  </div>
</main>

<!-- API Modal -->
<div id="apiModalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="modal-close-btn" onclick="closeModal()">✖</button>
    <h2 id="modalTitle">API Response</h2>
    <pre id="modalContent">Loading...</pre>
  </div>
</div>

<!-- Admin PIN Modal (numpad) -->
<div id="pinModal" class="modal-overlay" style="display:none; justify-content:center; align-items:center;">
  <div class="modal" style="text-align: center;">
    <button class="modal-close-btn" onclick="closePinModal()">✖</button>
    <h2>Enter PIN to Confirm</h2>
    <input type="password" id="pinInput" placeholder="Enter your PIN" autocomplete="off" readonly style="font-size: 1.2em; text-align: center;" />
    <div id="numpad" style="display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; justify-content: center; margin-top: 15px;">
      <button onclick="appendPin('1')">1</button><button onclick="appendPin('2')">2</button><button onclick="appendPin('3')">3</button>
      <button onclick="appendPin('4')">4</button><button onclick="appendPin('5')">5</button><button onclick="appendPin('6')">6</button>
      <button onclick="appendPin('7')">7</button><button onclick="appendPin('8')">8</button><button onclick="appendPin('9')">9</button>
      <button onclick="clearPin()">⌫</button><button onclick="appendPin('0')">0</button><button onclick="verifyAdminPinAndAddCoins()">✔</button>
    </div>
    <div id="pinModalError" style="color:red; margin-top:8px;"></div>
  </div>
</div>

<script>
//const BASE_URL = `$(window.location.origin)/projects/crypto`;
const API_URL = '../api/wallet.php';
//const API_URL = `${BASE_URL}/api/wallet.php`;
const responseElement = document.getElementById('apiResponse');
const user = JSON.parse(localStorage.getItem('loggedInUser'));
if (!user || user.role !== 'admin') window.location.href = 'login.html';

const modalOverlay = document.getElementById('apiModalOverlay');
const modalContent = document.getElementById('modalContent');
let walletToUsernameMap = {};
let pendingAdminAction = null;

function logout() {
  localStorage.removeItem('loggedInUser');
  window.location.href = '../index.html';
  //window.location.href = `${BASE_URL}/index.html`;
}

function showModal(content) {
  modalContent.textContent = content;
  modalOverlay.style.display = 'flex';
}

function closeModal() {
  modalOverlay.style.display = 'none';
}

function closePinModal() {
  document.getElementById('pinModal').style.display = 'none';
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModalError').textContent = '';
}

function appendPin(digit) {
  const input = document.getElementById('pinInput');
  if (input.value.length < 6) input.value += digit;
}

function clearPin() {
  const input = document.getElementById('pinInput');
  input.value = input.value.slice(0, -1);
}

function prepareAdminAddCoins() {
  const select = document.getElementById('adminRecipientSelect');
  const address = select.value;
  const amount = parseFloat(document.getElementById('adminAmount').value);
  if (!address) return showModal('Please select a wallet address.');
  if (isNaN(amount) || amount <= 0) return showModal('Invalid amount.');
  pendingAdminAction = { address, amount };
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModalError').textContent = '';
  document.getElementById('pinModal').style.display = 'flex';
}

async function verifyAdminPinAndAddCoins() {
  const pin = document.getElementById('pinInput').value.trim();
  const pinError = document.getElementById('pinModalError');
  if (!pin || pin.length < 4) {
    pinError.textContent = 'PIN must be at least 4 digits.';
    return;
  }
  try {
    //const verifyResponse = await fetch('api/verify_pin.php', {
    const verifyResponse = await fetch('https://nahid-sekander.duckdns.org/projects/crypto/api/verify_pin.php', {
    //const verifyResponse = await fetch(`${BASE_URL}/api/verify_pin.php`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const verifyResult = await verifyResponse.json();
    if (!verifyResult.success) {
      pinError.textContent = 'Invalid PIN. Please try again.';
      return;
    }
    closePinModal();
    if (!pendingAdminAction) return showModal('Error: No pending admin action.');
    const { address, amount } = pendingAdminAction;
    pendingAdminAction = null;
    const data = await callApi('admin_add_coins', 'POST', { address, amount, pin });
    if (data) {
      const msg = data.error
        ? `❌ Error:\n${JSON.stringify(data, null, 2)}`
        : `✅ Success:\n${JSON.stringify(data, null, 2)}`;
      showModal(msg);
    }
  } catch (error) {
    pinError.textContent = 'Network error. Please try again.';
    console.error('Error verifying PIN:', error);
  }
}

async function callApi(action, method = 'GET', body = null) {
  responseElement.textContent = 'Loading...';
  try {
    let url = `${API_URL}?action=${action}`;
    const options = { method, headers: {} };
    if (method === 'POST' && body) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    const response = await fetch(url, options);
    const data = await response.json();
    responseElement.textContent = JSON.stringify(data, null, 2);
    responseElement.className = data.error ? 'error' : 'success';
    return data;
  } catch (error) {
    responseElement.textContent = `Error: ${error.message}`;
    responseElement.className = 'error';
    return { success: false, error: error.message };
  }
}

async function getBalances() {
  const data = await callApi('get_balances');
  if (data) showModal(JSON.stringify(data, null, 2));
}

async function populateAdminRecipientDropdown() {
  const select = document.getElementById('adminRecipientSelect');
  select.innerHTML = '<option value="">Loading users...</option>';
  try {
    const response = await fetch('../api/users.json');
    //const response = await fetch(`${BASE_URL}/api/users.json`);
    if (!response.ok) throw new Error('Failed to load users.json');
    const users = await response.json();
    select.innerHTML = '<option value="">-- Select a user --</option>';
    users.forEach(u => {
      if (u.wallet) {
        walletToUsernameMap[u.wallet] = u.username;
        if (u.username !== user.username) {
          const option = document.createElement('option');
          option.value = u.wallet;
          option.textContent = `${u.username} (${u.wallet.slice(0, 8)}...)`;
          select.appendChild(option);
        }
      }
    });
  } catch (err) {
    select.innerHTML = '<option value="" disabled>Error loading users</option>';
    responseElement.textContent = `Error: ${err.message}`;
    responseElement.className = 'error';
  }
}

function loadTransactionsFromDropdown() {
  const select = document.getElementById('filterTxDropdown');
  displayTransactionHistory(select.value || null);
}

async function displayTransactionHistory(walletAddress = null) {
  const container = document.getElementById('historyContainer');
  container.innerHTML = '<p>Loading history...</p>';
  try {
    const data = await callApi('load_blockchain');
    if (!data.success || !Array.isArray(data.blockchain)) throw new Error('Invalid blockchain data');
    const allTx = data.blockchain.flatMap(b =>
      (b.transactions || []).map(tx => ({ ...tx, timestamp: b.timestamp }))
    ).filter(tx =>
      !walletAddress || tx.from === walletAddress || tx.to === walletAddress
    );
    if (!allTx.length) return container.innerHTML = '<p>No transactions found.</p>';
    container.innerHTML = `
      <table><thead><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th></tr></thead><tbody>
      ${allTx.reverse().map(tx => `
        <tr>
          <td>${new Date(tx.timestamp * 1000).toLocaleString()}</td>
          <td>${walletToUsernameMap[tx.from] || tx.from}</td>
          <td>${walletToUsernameMap[tx.to] || tx.to}</td>
          <td class="${tx.from === walletAddress ? 'tx-sent' : tx.to === walletAddress ? 'tx-received' : 'tx-neutral'}">
            ${(tx.from === walletAddress ? '-' : tx.to === walletAddress ? '+' : '') + tx.amount}
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  } catch (error) {
    container.innerHTML = `<p class="error">${error.message}</p>`;
  }
}

async function populateFilterDropdown() {
  const dropdown = document.getElementById('filterTxDropdown');
  try {
    const response = await fetch('../api/users.json');
    const users = await response.json();
    dropdown.innerHTML = '<option value="">All Users</option>';
    users.forEach(u => {
      if (u.wallet) {
        walletToUsernameMap[u.wallet] = u.username;
        const option = document.createElement('option');
        option.value = u.wallet;
        option.textContent = `${u.username} (${u.wallet.slice(0, 8)}...)`;
        dropdown.appendChild(option);
      }
    });
    displayTransactionHistory();
    dropdown.addEventListener('change', () => {
      displayTransactionHistory(dropdown.value || null);
    });
  } catch (err) {
    console.error('Dropdown error:', err);
  }
}

document.querySelectorAll('.accordion-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const content = btn.nextElementSibling;
    content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + 'px';
  });
});

window.addEventListener('DOMContentLoaded', () => {
  populateAdminRecipientDropdown();
  populateFilterDropdown();
});
</script>
</body>
</html>
